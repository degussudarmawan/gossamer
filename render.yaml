# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Free pilot infrastructure: one Render Free web service plus an external
# Neon Free PostgreSQL database. Free services sleep after 15 idle minutes and take
# about a minute to wake. Use the reviewed release branch; no branch is hardcoded.
previews:
  generation: "off"

services:
  - type: web
    name: gossamer
    runtime: docker
    plan: free
    region: singapore
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    # Free services have no pre-deploy command, so each start applies pending migrations
    # first. One Node entry point avoids provider-specific shell quoting.
    dockerCommand: node dist/start-hosted.js
    # Startup already refuses to listen without a migrated database. This check avoids
    # querying Neon every few seconds, so Neon can sleep and save its free compute hours.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # Neon's Direct (non-pooled) connection string. Set sslmode=verify-full;
      # preserve the other connection parameters supplied by Neon.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: MAIL_MODE
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Gossamer <login@gossamer.blog>
      - key: SIGN_IN_MODE
        value: public
      # PUBLIC_ORIGIN defaults to Render's assigned HTTPS URL.
      # Set it in the dashboard if you attach and use a custom website domain.
